<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Pizza Ordering Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <div class="bot-avatar">🍕</div>
                <div class="header-info">
                    <h2>Pizza Ordering Assistant</h2>
                    <span class="status" id="connectionStatus">Connecting...</span>
                </div>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hi! I'm your pizza ordering assistant. What would you like to order today?</p>
                    <span class="message-time" id="welcomeTime"></span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="typing-content">
                <div class="bot-avatar-small">🤖</div>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    autocomplete="off"
                    disabled
                >
                <button id="sendButton" disabled>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Menu Modal -->
    <div class="menu-modal" id="menuModal" style="display: none;">
        <div class="menu-content">
            <div class="menu-header">
                <h3>🍕 Our Menu</h3>
                <button class="close-menu" id="closeMenu">&times;</button>
            </div>
            <div class="menu-items" id="menuItems">
                <!-- Menu items will be loaded here -->
            </div>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
